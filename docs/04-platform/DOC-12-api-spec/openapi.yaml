openapi: 3.0.1
info:
  title: HRM Gateway API
  version: 0.2.0
  description: "SoT machine của DOC-12. **Sinh từ Swagger runtime** của Hrm.Host ngày 2026-09-07 (doc-review Blocker B3: bản v0.1 viết tay chỉ có 16 path / 82 path thật).\nBase URL và issuer OIDC vẫn TBD (OQ-DLV-001, DOC-17). JWT từ IdP Cty (ADR-007).\nPath đã bao gồm tiền tố /v1, nên server url KHÔNG kèm /v1.\nNhóm /dev là DEV/UAT only — 404 ngoài Development (DEC-DLV-011, CR-001 closed-rejected cho Prod)."
servers:
  -
    url: https://{host}
    variables:
      host:
        default: hrm.example.internal
        description: TBD DOC-17
tags:
  -
    name: iam
  -
    name: emp
  -
    name: lev
  -
    name: tim
  -
    name: pay
  -
    name: prb
  -
    name: lif
  -
    name: dev
