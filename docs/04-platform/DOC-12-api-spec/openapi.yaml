components:
  schemas:
    ApplyLifOffboardingLocksRequest:
      type: object
      properties:
        asOfDate:
          type: string
          nullable: true
        earlyCrReason:
          type: string
          nullable: true
      additionalProperties: false
    AssignRoleRequest:
      type: object
      properties:
        roleCode:
          type: string
          nullable: true
      additionalProperties: false
    BaseResponse:
      type: object
      properties:
        traceId:
          type: string
          description: Unique trace identifier
          nullable: true
        spanId:
          type: string
          nullable: true
        traceParent:
          type: string
          description: Include traceparent in the next request's header for end-to-end tracing
          nullable: true
        timestamp:
          type: string
          description: Timestamp of request. Timezone UTC
          format: date-time
        code:
          type: string
          description: "**Application error id** — always read this on HTTP **422** (and other error statuses) to know which business rule failed.\n\nError code. Structure: {NAME}:{YY}00000\r\n- NAME: Name of project. Ex: Sample.User.WebApi\r\n- YY: Identity of resource. Ex: User = 01, ShippingAddress = 02\r\n- 000: Error code, default is 999\r\nDocument reference: https://dev.azure.com/belleai/Common%20Library/_wiki/wikis/Common-Library.wiki/3098/Coding-Convention?anchor=error-code\n\nRuntime format: `Hrm.Host:{suffix}` where suffix comes from error constants (see `BaseResponse.GenerateCode`).\n\nKnown shared suffix values (message from `IErrorCode`):\n- **00000**: OK\n- **99001**: Reached request limit.\n- **99002**: Captcha is required\n- **99003**: The data you edited has been changed by another user. Please refresh and try again.\n- **99999**: Something went wrong"
          nullable: true
          example: Hrm.Host:99999
        error:
          $ref: "#/components/schemas/BaseResponseError"
      additionalProperties: false
      description: "Standard JSON envelope for API responses. When the server returns HTTP 422 (Unprocessable Entity), the body uses this shape: the **code** property is always set to the application error identifier so clients can branch on it programmatically. Format is `{entryAssembly}:{suffix}` where `suffix` matches `IErrorCode` constants."
    BaseResponseError:
      type: object
      properties:
        message:
          type: string
          description: Message of ErrorCode
          nullable: true
        systemMessage:
          type: string
          description: "Message of system. Ex: exception system, exception http request"
          nullable: true
        details:
          type: array
          items:
            $ref: "#/components/schemas/BaseResponseErrorDetail"
          description: Error detail in ModelState
          nullable: true
      additionalProperties: false
      description: The class define base error of response. Use for http response 400
    BaseResponseErrorDetail:
      required:
        - field
      type: object
      properties:
        field:
          type: string
          description: Field has error
          nullable: true
        codes:
          type: array
          items:
            type: string
          description: List error code of field
          nullable: true
        systemMessages:
          type: array
          items:
            type: string
          description: List system message
          nullable: true
      additionalProperties: false
      description: The class define base error detail of response
