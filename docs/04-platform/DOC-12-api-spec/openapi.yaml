  /dev/token:
    get:
      tags:
        - DevAuth
      parameters:
        -
          name: sub
          in: query
          schema:
            type: string
            default: local-dev
        -
          name: email
          in: query
          schema:
            type: string
        -
          name: api-version
          in: query
          schema:
            type: string
        -
          name: traceparent
          in: header
          description: "Distributed tracing header (W3C Trace Context). Format: 00-{traceId}-{spanId}-01"
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/DevTokenResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/DevTokenResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/DevTokenResponse"
